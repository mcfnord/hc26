# /etc/nginx/sites-available/johns.living — HexC behind nginx with TLS.
# certbot manages the ssl_* lines; apply with:
#   cp deploy/nginx-johns.living.conf /etc/nginx/sites-available/johns.living && nginx -t && systemctl reload nginx
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name johns.living www.johns.living;

    ssl_certificate /etc/letsencrypt/live/johns.living/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/johns.living/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5235;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name johns.living www.johns.living;
    return 301 https://$host$request_uri;
}
