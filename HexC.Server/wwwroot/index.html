                    body: JSON.stringify({ credential: response.credential })
                });
                if (!res.ok) { showToast('Sign-in failed. Please try again.'); return; }
                const me = await res.json();
                showSignedIn(me);
                showToast(`Signed in as ${me.name}`);
                enterLobby();   // the anonymous game is discarded (PLAN.md 2026-09-30)
            } catch (e) { showToast('Sign-in failed. Please try again.'); }
        }
        async function signOut() {
            if (!confirm('Sign out?')) return;
            clearTimeout(lobbyTimer); lobbyTimer = null;
            try { await fetch(`${LOBBY_URL}/leave`, { method: 'POST' }); } catch (e) {}   // frees a waiting seat
            await fetch(`${AUTH_URL}/signout`, { method: 'POST' });
            if (window.google) google.accounts.id.disableAutoSelect();
            showSignedIn({ signedIn: false });
            hideLobby();
            stopGame();
            joinGame(DEFAULT_GAME_ID);
        }
        async function initAuth() {
            let me = null;
            try { me = await (await fetch(`${AUTH_URL}/me`)).json(); } catch (e) {}
            if (me) showSignedIn(me);
            // Where to land (PLAN.md 2026-09-30): signed in, your game or the table; otherwise the anonymous game.
            if (me && me.signedIn) enterLobby(); else joinGame(requestedGameId());
            if (!me || !me.clientId) return;
            // The Google script loads async; wait for it.
            for (let i = 0; i < 100 && !window.google?.accounts?.id; i++) await new Promise(r => setTimeout(r, 100));
            if (!window.google?.accounts?.id) return;
            google.accounts.id.initialize({ client_id: me.clientId, callback: onGoogleCredential });
            google.accounts.id.renderButton(document.getElementById('google-signin'),
                { type: 'standard', theme: 'filled_black', size: 'medium', text: 'signin', shape: 'pill' });
        }
        // The table (PLAN.md 2026-09-30, zero buttons): ask the server where we belong. While
        // waiting, show who is seated and poll; once the game has started, join it.
        const LOBBY_URL = API_URL.replace(/Game$/, 'Lobby');
        let lobbyTimer = null;
        let lobbyView = null;
        async function enterLobby() {
            clearTimeout(lobbyTimer); lobbyTimer = null;
            let view;
            try {
                const res = await fetch(`${LOBBY_URL}/enter`, { method: 'POST' });
                if (res.status === 401) { showSignedIn({ signedIn: false }); hideLobby(); joinGame(DEFAULT_GAME_ID); return; }
                if (!res.ok) throw new Error(`enter: ${res.status}`);
                view = await res.json();
            } catch (e) { lobbyTimer = setTimeout(enterLobby, 3000); return; }
            document.getElementById('login-overlay').style.display = 'none';
            if (view.waiting) {
                if (gid) stopGame();
                renderLobby(view);
                lobbyTimer = setTimeout(enterLobby, 2000);
            } else {
                hideLobby();
                if (gid !== view.gameId) await joinGame(view.gameId);
            }
        }
        function renderLobby(view) {
            lobbyView = view;
            const seatsEl = document.getElementById('lobby-seats');
            seatsEl.innerHTML = '';
            for (const color of ['Blue', 'White', 'Red']) {
                const seat = (view.seats || []).find(s => s.color === color);
                const row = document.createElement('div');
                row.className = 'lobby-seat';
                const who = document.createElement('span');
                who.className = 'lobby-color';
                who.style.color = `var(--color-${color.toLowerCase()})`;
                who.textContent = color;
                const name = document.createElement('span');
                name.textContent = !seat ? 'waiting…' : seat.color === view.yourColor ? 'You' : seat.name;
                row.appendChild(who); row.appendChild(name);
                seatsEl.appendChild(row);
            }
            updateLobbyCountdown();
            document.getElementById('turn-indicator').innerText = 'Waiting...';
            document.getElementById('status-message').innerText = 'Waiting for opponents';
            document.getElementById('lobby-overlay').style.display = 'flex';
        }
        function updateLobbyCountdown() {
            const el = document.getElementById('lobby-countdown');
            if (!lobbyView) return;
            if (!lobbyView.countdownEndsUtc) { el.textContent = 'The game starts when someone else arrives.'; return; }
            const secs = Math.max(0, Math.round((new Date(lobbyView.countdownEndsUtc) - Date.now()) / 1000));
            el.textContent = `AI sits down in ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
        }
        setInterval(updateLobbyCountdown, 1000);
        function hideLobby() {
            lobbyView = null;
            document.getElementById('lobby-overlay').style.display = 'none';
        }
        // Leave the current game on screen without showing the login overlay.
        function stopGame() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = null;
            if (aiTimer) clearTimeout(aiTimer);
            aiTimer = null;
            gid = '';
            clearSelection();
            clearThreats();
            boardState = [];
            pieceDOMMap.clear();
            piecesGroup.innerHTML = '';
            traceGroup.innerHTML = '';
            lastCheckState = "NONE";
            lastShimmerTurn = null;
            inTable = false;
            document.getElementById('turn-indicator').innerText = 'Waiting...';
            document.getElementById('status-message').innerText = '';
        }

        // Lands on the right game (see initAuth) and sets up the Google button.
        initAuth();
    </script>
</body>
</html>
